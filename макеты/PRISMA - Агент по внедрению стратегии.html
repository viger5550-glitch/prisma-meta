  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00%;object-fit:contain;display:block\"><\u002Fdiv><span style=\"font:400 9px/1.4 ui-monospace,Menlo,monospace;color:#8a8a8a\">01 · План на 12 недель<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;transition:transform .4s cubic-bezier(.2,.8,.2,1)\" style-hover=\"transform:translateY(-4px)\"><div style=\"aspect-ratio:1/2;overflow:hidden;background:#fff\"><img src=\"5a80e7a0-4ebc-4db0-8c08-ba5e2b2129cd\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv><span style=\"font:400 9px/1.4 ui-monospace,Menlo,monospace;color:#8a8a8a\">02 · Шаг недели<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;transition:transform .4s cubic-bezier(.2,.8,.2,1)\" style-hover=\"transform:translateY(-4px)\"><div style=\"aspect-ratio:1/2;overflow:hidden;background:#fff\"><img src=\"e0022369-e82a-4202-89ed-67a461b51030\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv><span style=\"font:400 9px/1.4 ui-monospace,Menlo,monospace;color:#8a8a8a\">03 · Ответ по стратегии<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;transition:transform .4s cubic-bezier(.2,.8,.2,1)\" style-hover=\"transform:translateY(-4px)\"><div style=\"aspect-ratio:1/2;overflow:hidden;background:#fff\"><img src=\"89498474-5b6a-477e-834b-65f22b338653\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv><span style=\"font:400 9px/1.4 ui-monospace,Menlo,monospace;color:#8a8a8a\">04 · Пятничный чек-ин<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;transition:transform .4s cubic-bezier(.2,.8,.2,1)\" style-hover=\"transform:translateY(-4px)\"><div style=\"aspect-ratio:1/2;overflow:hidden;background:#fff\"><img src=\"7bd08874-b020-4199-8f3f-81fbd8f7a0f9\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv><span style=\"font:400 9px/1.4 ui-monospace,Menlo,monospace;color:#8a8a8a\">05 · Итоги недели<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section data-screen-label=\"Problem\" style=\"padding:96px 6vw;display:flex;flex-wrap:wrap;gap:48px 6vw;align-items:flex-start\">\n    <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:16px\">\n      <p style=\"margin:0;display:flex;align-items:center;gap:10px;font:500 8.5px/1.4 Montserrat;letter-spacing:.32em;text-transform:uppercase;color:#a8a8a8\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00e37a\"><\u002Fspan>01 · В чём проблема<\u002Fp>\n      <p style=\"margin:0;font:400 italic clamp(30px,3.4vw,46px)/1.15 'Playfair Display',Georgia,serif;text-wrap:balance\"><span style=\"box-shadow:inset 0 -.25em 0 #00e37a\">«Стратегия, за которую клиенты дорого платят, так и остаётся жить в PDF»<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:2 1 380px;display:flex;flex-direction:column;gap:18px;max-width:62ch\">\n      <p style=\"margin:0;font:400 14px/1.9 Montserrat;color:#2a2a2a;text-wrap:pretty\">Клиент — финансовый консультант. Он разрабатывает стратегии для своих клиентов, и это дорогая услуга. Но любую стратегию нужно уметь внедрять, а без сопровождения она часто остаётся документом, который никто не открывает.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Tried\" style=\"background:#fff;padding:96px 6vw;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;align-items:center;gap:18px\">\n      <span style=\"display:block;width:3px;height:34px;background:#0a0a0a;flex:none\"><\u002Fspan>\n      <h2 style=\"margin:0;font:400 30px/1.2 'Playfair Display',Georgia,serif\">Что пробовали<\u002Fh2>\n    <\u002Fdiv>\n    <ul style=\"margin:0 0 0 21px;padding:0;list-style:none;display:flex;flex-direction:column;max-width:760px;border-top:1px solid #e2e2e2\">\n      <li style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:18px 0;border-bottom:1px solid #e2e2e2\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5a5ad6;margin-top:9px\"><\u002Fspan><span style=\"font:400 13.5px/1.8 Montserrat;color:#4a4a4a;text-wrap:pretty\"><b style=\"font:400 20px/1.3 'Playfair Display',Georgia,serif;color:#0a0a0a\">Очные встречи по внедрению<\u002Fb> — дорого: час консультанта стоит дорого. А его клиентам на самом деле нужно другое: просто делать, сверяться со стратегией и принимать решения в ключевых точках.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Solution\" style=\"padding:96px 6vw;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <span style=\"display:block;width:3px;height:34px;background:#0a0a0a;flex:none\"><\u002Fspan>\n        <h2 style=\"margin:0;font:400 30px/1.2 'Playfair Display',Georgia,serif\">Что придумали<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 0 21px;max-width:60ch;font:400 14px/1.9 Montserrat;color:#2a2a2a;text-wrap:pretty\">Разбили стратегию на пошаговый план: что и когда делает клиент консультанта, какие метрики отслеживаем, как готовимся к чек-сессии. Этот трекшен заложили в бота, который ведёт клиентов по плану между встречами.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px\">\n      <article style=\"flex:0 1 640px;min-width:0;background:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:26px;border-top:3px solid #00e37a;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s\" style-hover=\"transform:translateY(-6px);box-shadow:0 24px 48px rgba(0,0,0,.10)\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font:500 8.5px/1.4 Montserrat;letter-spacing:.3em;text-transform:uppercase;color:#8a8a8a\">Поток A · Внедрение стратегии<\u002Fspan>\n          <span style=\"font:400 28px/1.15 'Playfair Display',Georgia,serif\">Бот-трекер<\u002Fspan>\n          <p style=\"margin:0;font:400 13px/1.8 Montserrat;color:#2a2a2a;text-wrap:pretty\">Каждую неделю асинхронно помогает клиентам консультанта двигаться по плану, а к чек-сессиям собирает контекст для решений.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleA }}\" style=\"all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #e2e2e2;border-bottom:1px solid #e2e2e2\"><span style=\"font:700 9px/1 Montserrat;letter-spacing:.24em;text-transform:uppercase\">{{ labelA }}<\u002Fspan><span style=\"width:28px;height:28px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font:400 16px/1 Montserrat;transform:{{ rotA }};transition:transform .3s\">+<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ openA }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:26px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:700 9px/1 Montserrat;letter-spacing:.24em;text-transform:uppercase\">Как это работает<\u002Fspan>\n          <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n            <li style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat;color:#4a4a4a\"><span style=\"font:400 9px/2.2 ui-monospace,Menlo,monospace;color:#a8a8a8\">01<\u002Fspan><span>Каждую неделю бот напоминает клиенту консультанта о следующем шаге плана и помогает его выполнить.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat;color:#4a4a4a\"><span style=\"font:400 9px/2.2 ui-monospace,Menlo,monospace;color:#a8a8a8\">02<\u002Fspan><span>Все чек-сессии транскрибируются, а переписка в рабочем чате собирается в базу знаний агента.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat;color:#4a4a4a\"><span style=\"font:400 9px/2.2 ui-monospace,Menlo,monospace;color:#a8a8a8\">03<\u002Fspan><span>Перед чек-сессией агент подсвечивает контекст, чтобы принять решение: всё идёт хорошо или нужен пивот.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:700 9px/1 Montserrat;letter-spacing:.24em;text-transform:uppercase\">Что получил клиент<\u002Fspan>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n            <li style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00e37a;flex:none\"><\u002Fspan><span>Стратегию, разбитую на пошаговый план с метриками<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00e37a;flex:none\"><\u002Fspan><span>Бота, который ведёт его клиентов по плану между чек-сессиями<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00e37a;flex:none\"><\u002Fspan><span>Контекст для решений на каждой чек-сессии<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00e37a;flex:none\"><\u002Fspan><span>Новый продукт: подписку на сопровождение внедрения<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:700 9px/1 Montserrat;letter-spacing:.24em;text-transform:uppercase\">На какие метрики влияет<\u002Fspan>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n            <li style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat;color:#4a4a4a\"><span style=\"font:600 11px/1.7 Montserrat;color:#00b862\">↑<\u002Fspan><span><b style=\"font-weight:600;color:#0a0a0a\">Клиентский опыт<\u002Fb> — внедрённая стратегия даёт виральность и сарафанное радио<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #e2e2e2;font:400 12.5px/1.7 Montserrat;color:#4a4a4a\"><span style=\"font:600 11px/1.7 Montserrat;color:#00b862\">↑<\u002Fspan><span><b style=\"font-weight:600;color:#0a0a0a\">Рекуррентная выручка<\u002Fb> — бот и чек-сессии продаются по ежемесячной подписке на период внедрения. Его клиентам это дешевле, чем оплачивать час финансового консультанта<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <\u002Fdiv><\u002Fsc-if>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:80px 6vw;display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;align-items:center\">\n    <a href=\"https://t.me/vigerman\" style=\"padding:18px 52px;background:#00e37a;color:#0a0a0a;font:700 9px/1 Montserrat;letter-spacing:.24em;transition:background .25s,color .25s\" style-hover=\"background:#0a0a0a;color:#fff\">ХОЧУ ТАКОГО БОТА<\u002Fa>\n  <\u002Fsection>\n\n  <footer style=\"background:#fff;border-top:1px solid #f1f1f1;padding:30px 6vw;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px\">\n      <a href=\"https://knowledge.productodel.ru/legal/privacy\" style=\"font:500 8.5px/1 Montserrat;letter-spacing:.3em;text-transform:uppercase;color:#4a4a4a\">Политика конфиденциальности<\u002Fa>\n      <a href=\"https://knowledge.productodel.ru/legal/offer\" style=\"font:500 8.5px/1 Montserrat;letter-spacing:.3em;text-transform:uppercase;color:#4a4a4a\">Оферта<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:30px\">\n      <span style=\"font:500 8.5px/1 Montserrat;letter-spacing:.3em;text-transform:uppercase;color:#4a4a4a\">Контакт<\u002Fspan>\n      <a href=\"https://t.me/viger_onn\" aria-label=\"Telegram\" style=\"display:flex;color:#4a4a4a\" style-hover=\"color:#00e37a\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M22 3 2 11l7 2.5L11.5 21 15 15.5l5.5 4L22 3Z\"><\u002Fpath><path d=\"m9 13.5 13-10.5\"><\u002Fpath><\u002Fsvg><\u002Fa>\n      <a href=\"https://www.threads.net/@viger_on\" aria-label=\"Threads\" style=\"display:flex;width:16px;height:16px;align-items:center;justify-content:center;font:600 15px/1 Montserrat;color:#4a4a4a\" style-hover=\"color:#00e37a\">@<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { a: false };\n  renderVals() {\n    const a = this.state.a;\n    return {\n      openA: a,\n      labelA: a ? 'Свернуть' : 'Как это работает · результат · метрики',\n      rotA: a ? 'rotate(45deg)' : 'none',\n      toggleA: () => this.setState({ a: !a })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
